<!DOCTYPE html>
<html lang="pt-BR">
<head>
  
  <meta charset="UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro - MARKETPLACE SASS</title>

  
  <style>
    
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif; 
      background-color: #1a1a2e; 
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh; 
    }
    .container {
      background-color: #3f3d56; 
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      width: 300px;
    }

  
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #228B22; 
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="number"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: none;
      border-radius: 5px;
    }

    button {
      width: 106%;
      padding: 10px;
      background-color: #228B22; 
      border: none;
      border-radius: 5px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #228B22;
    }
  </style>
</head>
<body>

  <div class="container">
   
    <h1>Bem vindo(a) ao MARKETPLACE SASS</h1>
   
    <form action="/cadastro" method="POST">
      
      <input type="text" name="nome" placeholder="Digite seu nome" required>
      
      <input type="email" name="email" placeholder="Digite seu email" required>
      
      <input type="password" name="senha" placeholder="Digite sua senha" required>
      <input type="number" name="idade" placeholder="Digite sua idade" required>
      
     
      <button type="submit">Cadastre-se</button>
    </form>
  </div>
</body>
</html>
